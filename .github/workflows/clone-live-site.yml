name: Clone live site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          git clone --depth 1 https://github.com/LaxmanNepal/laxmannepal.github.io.git /tmp/source
          rm -rf /tmp/source/.git

      - name: Replace target contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -f .github/workflows/clone-live-site.yml

      - name: Commit cloned site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clone apps.laxmannepal.com.np source site" || exit 0
          git push origin main
